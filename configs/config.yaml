hydra:
  searchpath:
    # Compose kinetix config groups (env, model, learning, etc.) from the
    # third-party directory.  Path is relative to the working directory
    # (e.g. the project root when launched via ``python scripts/run.py``).
    - file://third_party/kinetix/configs

# ── Kinetix defaults (composed from third-party config groups) ───────────────
defaults:
  - env: entity                
  - env_size: l                
  - model:
    - model-base               
    - model-transformer        
    - model-perm-invariant-mlp 
  - train_levels: grouped    
  - eval: null            
  - learning:
    - ppo-base                 
    - ppo-rnn                 
  - repo: random  # config for policy repository type + hyperparameters
  - _self_

# ══════════════════════════════════════════════════════════════════════════════
#  Repo-agnostic experiment settings
# ══════════════════════════════════════════════════════════════════════════════

seed: 0                       # JAX random seed for reproducibility

# ── Environment batching ─────────────────────────────────────────────────────
num_copies_per_env: 4         # parallel copies per distinct env;
                              # total batch per policy = candidate_pool_size × num_copies_per_env

# ── Training budget ──────────────────────────────────────────────────────────
num_updates: 100              # PPO update steps per repository iteration (inner loop)
num_repo_updates: 40          # number of repository steps (outer loop over ppo training)

# ── Repository structure ─────────────────────────────────────────────────────
num_policies: 4               # fixed number of policy networks in the repository
candidate_pool_size: 6        # distinct envs randomly sampled per repo step.
                              # must satisfy (candidate_pool_size × num_copies_per_env) % num_minibatches == 0

# ── Evaluation ───────────────────────────────────────────────────────────────
eval_ratio: 0.2                   # train/eval split ratio (used when eval config is null)
eval_rollout_steps: 512           # rollout steps for frozen-policy evaluation;
                                  # environments auto-reset after 256 steps (Kinetix truncation)
evaluate_finetune_steps: 50       # PPO steps for per-env fine-tuning in evaluate_finetune;
                                  # fine-tuned params are discarded after evaluation,
                                  # so doesn't impact results. Only for diagnostics.
pretrain_eval_finetune_steps: 20  # PPO steps for per-step diagnostic fine-tuning
                                  # (separate from evaluate_finetune_steps).
diagnostic_finetune_frequency: 5  # Run diagnostic fine-tuning every N repo steps.
                                  # 1 = every step; higher values reduce overhead.

# ── Assignment ───────────────────────────────────────────────────────────────
assignment_mode: greedy       # "greedy" (random argmax), "softmax", or "epsilon_greedy"
assignment_temperature: 0.1   # softmax temperature (only used when mode = softmax)
assignment_epsilon: 0.1       # exploration probability (only used when mode = epsilon_greedy)

# Override kinetix defaults for the repository setting (for speedier runs. not nessecarily best params)
learning:
  num_train_envs: 10          # total number of distinct training environments (only used when generating randomly rather than passing a list of handmade envs)
  num_minibatches: 2          # PPO minibatch subdivisions
  update_epochs: 8            # number of epochs over the same trajectory per PPO update
  num_steps: 64               # PPO rollout length (environment steps per trajectory segment)