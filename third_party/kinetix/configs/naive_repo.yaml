defaults:
  - env: entity
  - env_size: s
  - model:
    - model-base
    - model-transformer
    - model-perm-invariant-mlp # for compatibility
  - train_levels: s # or random
  - learning:
    - ppo-base
    - ppo-rnn
  - _self_

seed: 0
learning:
  num_train_envs: 50 # number of distinct envs
  num_minibatches: 5 # division of vectorized envs to smaller batches. Number of envs should be divisable by this
  update_epochs: 8 # the number of times to iterate over the same trajectory. Default: 8
  num_steps: 64 # PPO roleout length (how many steps in the trajectory)

num_copies_per_env: 5 # batch size for same env type. A policy network sees this many vecotrizes anvs at once.
num_updates: 100 # how many ppo updates to do on each env duing one repo iteration
num_repo_updates: 20 # how many skill repo updates

num_policies: 5 # fixed number of policies for now

use_wandb: false
video_frequency: 1
# NOTE: each env automatically resets after 256 steps