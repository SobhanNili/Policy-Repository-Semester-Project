[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apa"
version = "0.1.0"
description = "Adaptive policy reuse in jax. Semester Project @ A.Mathis Lab, EPFL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.15.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jax[cuda12]>=0.6.2",
    "kinetix-env",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "mediapy>=1.2.6",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
]

[tool.uv.sources]
kinetix-env = { path = "third_party/kinetix", editable = true }

[tool.setuptools.packages.find]
include = ["apa*"]
exclude = ["checkpoints*", "logs*", "wandb*", "third_party*", "configs*", "scripts*"]
