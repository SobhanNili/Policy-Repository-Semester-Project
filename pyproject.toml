[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apa"
version = "0.1.0"
description = "Adaptive policy reuse in jax. Semester Project @ A.Mathis Lab, EPFL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jax[cuda12]>=0.6.2",
    "kinetix-env",
    "loguru>=0.7.3",
]

[tool.uv.sources]
kinetix-env = { path = "third_party/kinetix", editable = true }

[tool.setuptools.packages.find]
include = ["apa*"]
exclude = ["checkpoints*", "logs*", "wandb*", "third_party*"]